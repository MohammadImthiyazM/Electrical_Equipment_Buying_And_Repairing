<div class="login-container">
  <div class="login-card">
    <div class="split-wrapper">
      <!-- Left Side: Form -->
      <div class="form-side">
        <div class="branding">
          <span class="icon animated-icon">⚡</span>
          <h1>Electrical Equipment Hub</h1>
        </div>
        <form (ngSubmit)="onLogin()" class="login-form">
          <div class="header-gradient">
            <h2>Sign In</h2>
            <p class="tagline">Power up your access!</p>
          </div>
          <div class="message-box">
            <div class="success-message" *ngIf="successMessage">
              <span class="message-icon">✅</span> {{ successMessage }}
            </div>
            <div class="error-message" *ngIf="errorMessage">
              <span class="message-icon">❌</span> {{ errorMessage }}
            </div>
          </div>
          <div class="form-group">
            <label for="email"><span class="field-icon">✉️</span> Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              required>
          </div>
          <div class="form-group">
            <label for="password"><span class="field-icon">🔒</span> Password</label>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              required>
          </div>
          <div class="form-group">
            <label for="usertype"><span class="field-icon">🎭</span> User Type</label>
            <select
              id="usertype"
              name="usertype"
              [(ngModel)]="usertype"
              required>
              <option value="" disabled selected>Select user type</option>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button type="submit" [disabled]="isLoading" class="login-btn animated-btn">
            <span class="btn-icon">🚀</span> {{ isLoading ? 'Logging In...' : 'Login' }}
          </button>
          <p class="signup-link">Don't have an account? <a href="/signup" class="link-animated">Sign Up</a></p>
        </form>
      </div>
      <!-- Right Side: Design -->
      <div class="design-side">
        <div class="design-content">
          <span class="design-icon">⚡</span>
          <h3>Welcome Back!</h3>
          <p>Log in to explore premium equipment and services.</p>
          <div class="decorative-shapes">
            <span class="shape circle"></span>
            <span class="shape wave"></span>
            <span class="shape triangle"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
