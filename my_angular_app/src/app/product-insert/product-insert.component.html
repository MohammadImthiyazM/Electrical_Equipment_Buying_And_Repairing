<div class="container">
  <div class="card">
    <h2>Add New Product</h2>
    <form (ngSubmit)="onSubmitProduct()" class="product-form">
      <div class="form-group">
        <label for="name">Product Name:</label>
        <input type="text" id="name" [(ngModel)]="product.name" name="name" required placeholder="Enter product name">
      </div>
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" [(ngModel)]="product.description" name="description" placeholder="Enter product description"></textarea>
      </div>
      <div class="form-group">
        <label for="price">Price:</label>
        <input type="number" id="price" [(ngModel)]="product.price" name="price" required min="0.01" step="0.01" placeholder="Enter price">
      </div>
      <div class="form-group">
        <label for="stock">Stock:</label>
        <input type="number" id="stock" [(ngModel)]="product.stock" name="stock" required min="0" step="1" placeholder="Enter stock quantity">
      </div>
      <div class="form-group">
        <label for="image">Product Image:</label>
        <input type="file" id="image" name="image" (change)="onFileChange($event)" accept="image/jpeg,image/png" required>
      </div>
      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Adding...' : 'Add Product' }}
      </button>
    </form>
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <a routerLink="/admin-home" class="back-link">Back to Admin Home</a>
  </div>
</div>
